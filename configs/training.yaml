schema_version: "1.0.0"
model_name: "baseline_logistic_regression"

data:
  raw_data_path: "Telco-Customer-Churn.csv"
  contract_config_path: "configs/data_contract.yaml"

split:
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15
  random_seed: 42
  stratify: true

features:
  primary_key: "customerID"
  target_column: "Churn"
  target_positive_value: "Yes"
  excluded_features:
    - "customerID"
    - "gender"
    - "SeniorCitizen"
  numeric_features:
    - "tenure"
    - "MonthlyCharges"
    - "TotalCharges"
  categorical_features:
    - "Partner"
    - "Dependents"
    - "PhoneService"
    - "MultipleLines"
    - "InternetService"
    - "OnlineSecurity"
    - "OnlineBackup"
    - "DeviceProtection"
    - "TechSupport"
    - "StreamingTV"
    - "StreamingMovies"
    - "Contract"
    - "PaperlessBilling"
    - "PaymentMethod"

model:
  type: "LogisticRegression"
  hyperparameters:
    C: 1.0
    solver: "lbfgs"
    max_iter: 1000
    random_state: 42
    class_weight: null

artifacts:
  output_dir: "models"
  pipeline_filename: "baseline_pipeline.joblib"
  metadata_filename: "baseline_metadata.json"
