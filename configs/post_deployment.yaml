# Post-Deployment Evaluation Configuration
# Configuration settings for delayed labels processing, campaign outcome evaluation,
# model performance review, retraining decision criteria, and reporting.

paths:
  historical_predictions_path: "reports/scoring/batch_predictions.csv"
  delayed_labels_path: "data/delayed_labels.csv"
  baseline_metrics_path: "reports/evaluation/evaluation_metrics.json"
  drift_report_path: "reports/drift/drift_report.json"
  output_dir: "reports/post_deployment"
  report_markdown_filename: "post_deployment_report.md"
  report_json_filename: "post_deployment_summary.json"

evaluation:
  evaluation_date: "2026-07-29"
  decision_threshold: 0.50
  campaign_capacity: 0.10
  n_bins: 10

campaign:
  enabled: true
  unit_contact_cost: 10.0      # USD per customer targeted
  unit_customer_value: 500.0   # USD estimated retained margin per prevented churn
  default_treatment_ratio: 0.80 # 80% targeted treatment, 20% control holdout

retraining_decision:
  pr_auc_drop_threshold: 0.05   # Maximum allowable PR-AUC drop from baseline before flagging
  brier_score_max: 0.20         # Maximum allowable Brier score
  psi_alert_threshold: 0.25     # PSI critical drift threshold
  min_match_rate: 0.80          # Minimum acceptable customer matching rate between predictions and delayed labels
