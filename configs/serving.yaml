schema_version: "1.0.0"
model_name: "baseline_logistic_regression"

model:
  model_dir: "models"
  pipeline_filename: "baseline_pipeline.joblib"
  metadata_filename: "baseline_metadata.json"

data:
  contract_config_path: "configs/data_contract.yaml"
  default_input_path: "Telco-Customer-Churn.csv"

scoring:
  decision_threshold: 0.50
  batch_id_prefix: "batch"
  id_column: "customerID"

output:
  output_dir: "reports/scoring"
  output_filename: "batch_predictions.csv"
  quarantine_dir: "reports/quarantine"
  quarantine_filename: "quarantine_report.json"

api:
  host: "127.0.0.1"
  port: 8000
  title: "Telco Customer Churn Prediction API"
  version: "1.0.0"

