[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "churn-prediction"
version = "0.1.0"
description = "A production-oriented customer churn prediction system."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "mlflow>=2.10.0,<3",
    "pandas>=2.2.0,<3",
    "pandera>=0.20.0,<1",
    "prometheus-client>=0.20.0",
    "pydantic>=2.7.0,<3",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.4.0,<2",
    "seaborn>=0.13.2",
    "uvicorn>=0.52.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "nbformat>=5.10.4",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/churn_prediction"]

[tool.pytest.ini_options]
addopts = "--cov=churn_prediction --cov-fail-under=80 --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
